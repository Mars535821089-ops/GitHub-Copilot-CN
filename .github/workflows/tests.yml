name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix work/runtime
      - run: node --test work/localization/test-localize.cjs work/localization/test-runtime.cjs work/localization/test-native-menu.cjs work/localization/test-ui-surfaces.cjs work/localization/test-dictionary.cjs work/localization/test-audit-ui.cjs work/localization/test-univer-locale.cjs
      - run: python work/localization/test-resource-pool.py
      - run: python work/localization/test-upstream-check.py
      - run: python work/localization/test-official-release.py
      - run: python work/localization/test-build-ui.py
